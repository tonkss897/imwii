<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMWI — Оформление заказа</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/js.js" charset="UTF-8" defer></script>
</head>
<body>
<div class="bg-anim"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div>
<div class="scroll-line" id="scrollLine"></div>
<nav>
    <a class="nav-logo" href="index.html">IMWI</a>
    <div class="nav-links">
        <a href="index.html#programs">Программы</a>
        <a href="home.html">О нас</a>
        <a href="tickets.html">Билеты</a>
        <a href="contacts.html">Контакты</a>
    </div>
</nav>

<div class="page-wrap">
    <div class="order-page">
        <h1 class="fade-in">ОФОРМЛЕНИЕ ЗАКАЗА</h1>
        <div class="order-form fade-in">
            <button class="promo-toggle" onclick="togglePromo()">Есть промокод? Нажмите, чтобы ввести код</button>
            <div class="promo-input-wrap" id="promoInput"><input class="form-input" type="text" placeholder="Введите промокод"></div>

            <div class="form-group">
                <label>Дата мероприятия</label>
                <input class="form-input" type="text" value='21 мая 2026, 20:00 "Пир Дракона"'>
            </div>
            <div class="form-group">
                <label>Количество гостей</label>
                <select class="form-input">
                    <option>1 гость</option><option>2 гостя</option><option>3 гостя</option>
                    <option>4 гостя</option><option>5+ гостей</option>
                </select>
            </div>
            <div class="form-group">
                <label>Гость №1</label>
                <input class="form-input" type="text" placeholder="Имя и фамилия">
            </div>
            <div class="form-group">
                <label>У Вас есть аллергия или непереносимость продуктов?</label>
                <div class="radio-group">
                    <label><input type="radio" name="allergy" value="yes"> Да</label>
                    <label><input type="radio" name="allergy" value="no" checked> Нет</label>
                </div>
            </div>
            <div class="form-group">
                <input class="form-input" type="tel" placeholder="Номер телефона">
            </div>
            <div class="form-group">
                <label>Как удобнее с Вами связаться?</label>
                <select class="form-input">
                    <option>По телефону</option><option>По email</option>
                    <option>Telegram</option><option>WhatsApp</option>
                </select>
            </div>
            <div class="form-group">
                <input class="form-input" type="email" placeholder="Email">
            </div>

            <div class="order-total">12 000 ₽</div>
            <button class="submit-btn">ОПЛАТИТЬ</button>
        </div>
    </div>
</div>
</body>
</html>
